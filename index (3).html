<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กรรมสิทธิ์ นามศัพท์</title>
<style>
/* ซ่อนหน้าเลือกสีผังเมืองเดิม */
main {
    display: none !important;
}
/* ---------- หน้าหลัก (ตัวแปรสีที่ map.css ใช้) ---------- */
:root{--bg:#f3f5f9;--card:#ffffff;--tx:#1b2333;--bd:#d9deea;--ac:#2563eb}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1524;--card:#1a2236;--tx:#e8ecf5;--bd:#2c3752;--ac:#7aa7ff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.row h2{margin:0;font-size:1rem}
#zones{display:flex;flex-wrap:wrap;gap:8px}
#zones button{padding:6px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}
#zones button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#picked{margin:12px 0 0;font-size:.9rem}

/* ================= map.css ================= */
/* ปุ่มเปิดแผนที่ (อยู่แถวเดียวกับหัวข้อสีผังเมือง) */
.mapbtn{margin:0;padding:0;border:0;background:none;color:var(--ac);cursor:pointer;font:inherit;font-size:.8rem;font-weight:700;white-space:nowrap}
.mapbtn:hover{text-decoration:underline}

/* popup ลอยทับหน้าหลัก */
.mm-back{position:fixed;inset:0;z-index:10000;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:0}
.mm-back.hide{display:none}
.mm-back.full{padding:0}
.mm-back.full .mm-box{width:100%;height:100%;border-radius:0;border:0}
.mm-box{
    width:100%;
    height:100%;
    max-width:none;
    border-radius:0;
    border:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.mm-fs {
    display: none !important;
}
.mm-warn{margin:0;padding:6px 14px;font-size:.8rem;color:#ff6b6b;border-top:1px solid var(--bd)}
.mm-map {
    flex: 1;
    min-height: 0;
    isolation: isolate;

    /* ให้ Leaflet รับการสัมผัสจากนิ้วโดยตรง */
    touch-action: none !important;
    -webkit-user-select: none;
    user-select: none;
}
.mm-map.leaflet-container {
    touch-action: none !important;
}
.mm-picker{background:#fff;padding:4px;max-width:200px}
.mm-picker input{font-size:.75rem;width:100%;color:#1b2333}
.mm-pop .mm-img{margin:0 0 8px}
.mm-pop .mm-img button{padding:5px 12px;border:1px solid #2563eb;border-radius:99px;background:#e8efff;color:#1b2333;cursor:pointer;font:inherit;font-weight:700}
.mm-pop .mm-img img{width:100%;max-height:220px;object-fit:contain;display:block;margin-top:6px;border:1px solid #e2e6ee;border-radius:6px;background:#f8fafc}
.mm-pop .mm-img img{cursor:zoom-in}
.mm-pop .mm-img .mm-cap{display:block;margin-top:3px;font-size:.7rem;color:#6a7489}
.mm-lb{position:fixed;inset:0;z-index:10001;box-sizing:border-box;display:flex;overflow:auto;overscroll-behavior:contain;padding:12px;background:rgba(10,15,30,.88);cursor:zoom-out;touch-action:pan-x pan-y}
.mm-lb img{margin:auto;display:block;max-width:none;max-height:none;object-fit:contain;background:#fff;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);cursor:grab;touch-action:none;flex:none}
.mm-lb.zoom img{cursor:grab}
.mm-lb .mm-lbx{position:fixed;top:12px;right:12px;z-index:1;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#1b2333;font-size:1.2rem;cursor:pointer}
.mm-lb .mm-lbh{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;white-space:nowrap;pointer-events:none}
.mm-lb .mm-zoom-controls{position:fixed;left:12px;top:12px;z-index:2;display:flex;gap:6px}
.mm-lb .mm-zoom-controls button{min-width:40px;height:40px;padding:0 10px;border:0;border-radius:20px;background:rgba(255,255,255,.94);color:#1b2333;font-size:1rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}

.mm-legend{background:#fff;color:#1b2333;padding:6px 10px;border-radius:6px;font-size:.75rem;line-height:1.6;max-height:40vh;max-width:260px;overflow:auto;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mm-legend b{display:block;margin-bottom:2px}
.mm-legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border:1px solid #1b2333;vertical-align:-1px}
.mm-legend-toggle{display:none}
@media (max-width:600px){
  .mm-legend{max-width:125px;max-height:18vh;padding:3px 5px;font-size:.56rem;line-height:1.25;border-radius:7px}
  .mm-legend-toggle{display:block;width:100%;padding:2px 1px;border:0;background:transparent;color:#1b2333;text-align:left;font:inherit;font-size:.62rem;font-weight:700;cursor:pointer}
  .mm-legend-items{display:none;padding-top:3px}
  .mm-legend.open .mm-legend-items{display:block}
  .mm-legend b{margin:2px 0}
  .mm-legend i{width:9px;height:9px;margin-right:4px}
}
.mm-picker small{display:block;font-size:.72rem;color:#1b2333;padding:0 2px 3px}

/* label ของ feature (PL_BLOCK) */
.leaflet-tooltip.mm-lbl{background:none;border:0;box-shadow:none;padding:0;color:#000;font-weight:700;font-size:.72rem;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.leaflet-tooltip.mm-lbl:before{display:none}
.mm-map:not(.mm-showlbl) .mm-lbl{display:none}

/* เครื่องมือค้นหา lat,long */
.mm-search{display:flex;background:#fff;padding:3px;gap:3px;align-items:center}
.mm-search .bd{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.mm-search .ins{display:flex;gap:3px;align-items:center}
.mm-search .btns{display:flex;gap:3px;justify-content:center;align-items:center}
.mm-search.col .bd{display:none}
.mm-search.col{padding:0}
.mm-search .tg{background:#fff;width:auto;min-width:30px;padding:0 8px;white-space:nowrap}
.mm-search.one .la,.mm-search.one .lo{display:none}
.mm-search:not(.one) .ll{display:none}
.mm-search .ll{width:170px}
.mm-search .sw{background:#f1f5f9}
.mm-search input{width:90px;padding:5px 7px;border:1px solid #cfd5e1;border-radius:6px;font-size:.8rem;color:#1b2333;background:#fff}
.mm-search input.err{border-color:#dc2626;outline:2px solid #dc2626}
.mm-search button{width:30px;height:30px;border:0;border-radius:6px;background:#e8efff;color:#1b2333;cursor:pointer;font-size:.9rem}
.mm-search button.clr{background:#fee2e2;width:auto;padding:0 10px;white-space:nowrap;font-size:.8rem}

/* ปุ่มตำแหน่งปัจจุบัน (ใต้ปุ่มซูมออก) */
.leaflet-bar a.mm-loc{font-size:1rem;text-decoration:none;color:#1b2333;text-align:center}
.leaflet-bar a.mm-loc.busy{opacity:.4;pointer-events:none}
.leaflet-bar a.mm-loc.tracking{background:#dbeafe;color:#1d4ed8;border:2px solid #2563eb}

/* popup ของ feature: กว้าง 260 สูง 350 คงที่ */

/* Popup ปรับขนาดตามเนื้อหา */
.mm-pop .leaflet-popup-content{
  width:max-content !important;
  max-width:min(360px, calc(100vw - 60px));
  height:auto !important;
  max-height:70vh;
  margin:10px 12px;
  overflow:auto;
  font-family:inherit;
  font-size:.85rem;
}

/* ตารางข้อมูล */
.mm-pop table{
  width:100%;
  border-collapse:collapse;
  font-size:.8rem;
  table-layout:auto;
}

/* ข้อความในตาราง */
.mm-pop td{
  padding:3px 6px;
  border-bottom:1px solid #e2e6ee;
  text-align:left;
  vertical-align:top;
}

/* ชื่อหัวข้อด้านซ้าย */
.mm-pop td:first-child{
  color:#6a7489;
  font-weight:600;
  white-space:nowrap;
}

/* ค่าข้อมูลด้านขวา: ไม่ตัดเป็นหลายบรรทัด */

.mm-pop .mm-pick{margin:0 0 8px}
.mm-pop .mm-pick small{display:block;margin-bottom:4px;color:#6a7489}
.mm-pop .mm-pick button{display:inline-flex;align-items:center;gap:7px;padding:5px 14px 5px 10px;border:2px solid var(--zc);background:var(--zc);color:var(--zt);border-radius:99px;cursor:pointer;font:inherit;font-weight:700}
.mm-pop .mm-pick button i{width:12px;height:12px;border-radius:50%;background:var(--zt)}
.mm-pop .mm-none{margin:0 0 8px;font-size:.78rem;color:#dc2626}
</style>

      <button type="button">ส.</button><button type="button">อศ.</button><button type="button">อป.</button>

  </div>

<script>
/* เลือกโซน: ตั้ง class="on" (map.js เรียก zb.click() เมื่อกดเลือกจากแผนที่) */
(function(){
  var z=document.getElementById("zones"),out=document.getElementById("picked");
  z.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    z.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");
    out.textContent="โซนที่เลือก: "+b.textContent;
  });
})();
</script>

<!-- ตั้งค่าชื่อฟิลด์จาก alias.xlsx ที่แนบมา (ฝังไว้ใน HTML เพื่อไม่ต้องโหลดแยก) -->
<script>

/* โหลดชื่อฟิลด์จาก alias.csv */
window.FIELD_CONFIG = {};

window.FIELD_CONFIG_READY = fetch("alias.csv")
  .then(response => {
    if (!response.ok) {
      throw new Error("ไม่พบไฟล์ alias.csv");
    }
    return response.arrayBuffer();
  })
  .then(buffer => {
    // รองรับภาษาไทย TIS-620 / Windows-874
    const csvText = new TextDecoder("windows-874").decode(buffer);

    // อ่าน CSV รองรับข้อความที่มีเครื่องหมายคำพูด
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (c === '"') {
          if (quoted && text[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (c === "," && !quoted) {
          row.push(value.trim());
          value = "";
        } else if ((c === "\n" || c === "\r") && !quoted) {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(value.trim());

          if (row.some(v => v !== "")) rows.push(row);

          row = [];
          value = "";
        } else {
          value += c;
        }
      }

      if (value !== "" || row.length) {
        row.push(value.trim());
        rows.push(row);
      }

      return rows;
    }

    const rows = parseCSV(csvText);
    const headers = rows.shift().map(v => v.replace(/^\uFEFF/, "").trim());

    const layerIndex = headers.indexOf("layer");
    const fieldIndex = headers.indexOf("field");
    const aliasIndex = headers.indexOf("ชื่อที่แสดง");
    const showIndex = headers.indexOf("show");

    if ([layerIndex, fieldIndex, aliasIndex, showIndex].includes(-1)) {
      throw new Error("หัวคอลัมน์ใน alias.csv ไม่ถูกต้อง");
    }

    rows.forEach(row => {
      const layer = row[layerIndex];
      const field = row[fieldIndex];

      if (!layer || !field) return;

      if (!window.FIELD_CONFIG[layer]) {
        window.FIELD_CONFIG[layer] = [];
      }

      window.FIELD_CONFIG[layer].push({
        f: field,
        l: row[aliasIndex] || "",
        s: Number(row[showIndex]) === 1 ? 1 : 0
      });
    });

    console.log("โหลด alias.csv สำเร็จ", window.FIELD_CONFIG);
  })
  .catch(error => {
    console.warn("ไม่สามารถโหลด alias.csv ได้ ใช้การตั้งค่าเริ่มต้นแทน:", error);
    window.FIELD_CONFIG = {};
  });

</script>

  function imageSrcs(cfg,props){   // รายการที่อยู่รูปที่จะลองตามลำดับ: (1) คอลัมน์ที่เก็บชื่อรูป (2) ชื่อไฟล์ตรงกับข้อมูล (3) ตารางจับคู่ image_map.js
    props=props||{};
    var out=[];
    function add(u){if(u&&out.indexOf(u)<0)out.push(u);}
    var dir=cfg.imageDir||"";
    // (1) imageField: ถ้าในตารางมีคอลัมน์ที่เก็บชื่อไฟล์/ลิงก์รูปโดยตรง ใช้ก่อนเลย
    [].concat(cfg.imageField||[]).forEach(function(col){
      var v=props[col];if(v==null)return;v=String(v).trim();if(!v)return;
      add(/^(https?:)?\/\//.test(v)||v.charAt(0)==="/"?encodeURI(v):dir+v.split("/").map(encodeURIComponent).join("/"));
    });
    // (2) image: แบบชื่อไฟล์ที่ประกอบจากข้อมูล ใส่ {ชื่อคอลัมน์} ได้ และ {ext} จะลองทุกนามสกุลใน imageExts
    var vars=props;
    if(cfg.imageVars){vars={};for(var q in props)vars[q]=props[q];var ex=cfg.imageVars(props)||{};for(var q2 in ex)vars[q2]=ex[q2];}
    var exts=cfg.imageExts||["jpg","png","jpeg","JPG","PNG"];
    [].concat(cfg.image||[]).forEach(function(t0){
      (t0.indexOf("{ext}")>=0?exts.map(function(e){return t0.replace("{ext}",e)}):[t0]).forEach(function(t){
        var ok=true;
        var src=t.replace(/\{(\w+)\}/g,function(_,k){
          var v=vars[k];if(v==null||String(v).trim()==="")ok=false;
          return encodeURIComponent(String(v==null?"":v).trim());
        });
        if(ok)add(src);
      });
    });
    // (3) imageMap: ตารางจับคู่ (คีย์ = ค่าในคอลัมน์ imageKey)
    if(cfg.imageMap){
      var k;
      if(cfg.imageKeyFields && cfg.imageKeyFields.length){
        k=cfg.imageKeyFields.map(function(col){
          var v=props[col];
          if(v==null)return "";
          return String(v).trim().replace(/\\.0$/,"");
        }).join("|");
      }else{
        k=props[cfg.imageKey||"LO_NO"];
        k=k==null?"":String(k).trim();
      }
      var f=k?cfg.imageMap[k]:null;
      if(f){
        [].concat(f).forEach(function(path){
          add(dir+String(path).split("/").map(encodeURIComponent).join("/"));
        });
      }
    }
    return out;
  }

    var minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","ซูมออก");

    var plus=document.createElement("button");plus.type="button";plus.textContent="+";
    controls.appendChild(minus);controls.appendChild(reset);controls.appendChild(plus);

    var scale=1,baseW=0,baseH=0,minScale=.15,maxScale=8;
    function setScale(next,center){
      if(!baseW||!baseH)return;
      var old=scale;
      scale=Math.max(minScale,Math.min(maxScale,next));
      var cx=center?center.x:lb.clientWidth/2;
      var cy=center?center.y:lb.clientHeight/2;
      var relX=(lb.scrollLeft+cx)/Math.max(1,im.offsetWidth);
      var relY=(lb.scrollTop+cy)/Math.max(1,im.offsetHeight);
      im.style.width=(baseW*scale)+"px";
      im.style.height=(baseH*scale)+"px";
      requestAnimationFrame(function(){
        lb.scrollLeft=relX*im.offsetWidth-cx;
        lb.scrollTop=relY*im.offsetHeight-cy;
      });
      lb.classList.toggle("zoom",scale>1.01);
    }
    function fitImage(){
      baseW=im.naturalWidth;baseH=im.naturalHeight;
      var fit=Math.min((lb.clientWidth-24)/baseW,(lb.clientHeight-70)/baseH,1);
      scale=Math.max(minScale,fit);
      im.style.width=(baseW*scale)+"px";
      im.style.height=(baseH*scale)+"px";
      lb.scrollLeft=0;lb.scrollTop=0;

    function closeLb(){

    function onKey(e){if(e.key==="Escape"){e.stopPropagation();e.preventDefault();closeLb();}}

        lb.scrollTop=p.scrollY-(e.clientY-p.startY);
        e.preventDefault();
      }else if(keys.length===2){
        var p1=pointers[keys[0]],p2=pointers[keys[1]];

        t.onclick=function(){
          var opened=d.classList.toggle("open");
          t.textContent=opened?"สี ▴":"สี ▾";
        };
        L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d;}});
      map._mmLegend=new Lg();map._mmLegend.addTo(map);
      var items=L.DomUtil.create("div","mm-legend-items",map._mmLegend.getContainer());
    }
    var h="";
    LAYERS.forEach(function(c){
      if(!c.colorBy||c.legend===false||!c.loaded||!c._gc||!map.hasLayer(c.layer))return;
      h+="<b>"+esc(c.name)+"</b>";
      Object.keys(c._gc).sort(function(a,b){return a.localeCompare(b,"th",{numeric:true})}).forEach(function(v){
        h+='<div><i style="background:'+c._gc[v]+'"></i>'+esc(c._gnm[v])+"</div>";
      });
    });
    var el=map._mmLegend.getContainer();
    var items=el.querySelector(".mm-legend-items");
    if(items)items.innerHTML=h;
    el.style.display=h?"":"none";
  }
  function makeLayer(c){   // สร้างชั้นเปล่าไว้ก่อน แล้วค่อยเติมข้อมูลตอนโหลดไฟล์
    c.layer=L.geoJSON(null,{
      pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:c.size||6});},   // ชั้นที่เป็นจุด: วงกลมเล็กแทนหมุดใหญ่ (ขนาดตั้งที่ size)
      style:function(f){
        var p=f.properties||{};
        var fc=c.color?fillOf(p[c.field]):(c.colorBy?groupColor(c,p):(c.fill||"#3388ff"));
        if(f.geometry&&/Point$/.test(f.geometry.type))
          return{radius:c.size||6,color:c.stroke||"#ffffff",weight:1.5,fillColor:fc,fillOpacity:.95};
        return{color:(c.color||c.colorBy)?"#1b2333":(c.stroke||c.fill||"#3388ff"),weight:1,
               fillColor:fc,fillOpacity:.6};
      },
      onEachFeature:function(f,l){
        l.bindPopup(function(){return buildPopup(f.properties,c)},{className:"mm-pop",minWidth:260,maxWidth:260});
        var t=c.label&&f.properties&&f.properties[c.label];
        var isPt=f.geometry&&/Point$/.test(f.geometry.type);
        if(t!=null&&t!=="")l.bindTooltip(String(t),isPt?{permanent:true,direction:"top",offset:[0,-(c.size||6)],className:"mm-lbl"}:{permanent:true,direction:"center",className:"mm-lbl"});
      }
    });
  }
  function showData(c,gj){
    if(Array.isArray(gj))gj={type:"FeatureCollection",features:gj.reduce(function(a,g){return a.concat(g.features||[])},[])};
    var p0=(gj.features.length&&gj.features[0].properties)||{};
    if(c.auto){   // ชั้นอัตโนมัติ: ถ้ามีคอลัมน์ผังเมืองให้ระบายสีตามโซน
      if("PL_GROUP" in p0){c.color=true;c.field="PL_GROUP";}
      if("PL_BLOCK" in p0)c.label="PL_BLOCK";
    }
    var g0=gj.features.length&&gj.features[0].geometry;
    c.isPoint=!!(g0&&/Point$/.test(g0.type));
    c.layer.clearLayers();
    c.layer.addData(gj);
    if(c.isPoint)c.layer.bringToFront();   // จุดอยู่เหนือพื้นที่เสมอ
    c.loaded=true;
    fit(c);
    updLabels();
    updLegend();
    var p=gj.features.length&&gj.features[0].properties;
    if(c.color&&p&&!(c.field in p))console.warn("["+c.name+"] ไม่พบคอลัมน์ "+c.field+" (มี: "+Object.keys(p).join(", ")+")");
  }
  function fromBuffer(c,buf){
    return shp(buf).then(function(gj){showData(c,gj)}).catch(function(e){alert("อ่านไฟล์ shapefile ["+c.name+"] ไม่ได้: "+e.message)});
  }
  /* ถ้าโหลด .zip อัตโนมัติไม่ได้ (เช่น เปิดแบบ file://) ให้มีปุ่มเลือกไฟล์บนแผนที่ */
  function addPicker(c){
    if(c.picker)return;
    var C=L.Control.extend({options:{position:"topleft"},onAdd:function(){
      var d=L.DomUtil.create("div","mm-picker leaflet-bar"),
          t=L.DomUtil.create("small","",d),
          i=L.DomUtil.create("input","",d);
      t.textContent="เลือกไฟล์ "+c.zip+" ("+c.name+")";
      i.type="file";i.accept=".zip";
      i.onchange=function(){
        var f=i.files[0];if(!f)return;
        var r=new FileReader();
        r.onload=function(){fromBuffer(c,r.result).then(function(){map.removeControl(c.picker);c.picker=null})};
        r.readAsArrayBuffer(f);
      };
      L.DomEvent.disableClickPropagation(d);
      return d;
    }});
    c.picker=new C();c.picker.addTo(map);
  }
  function fromUrl(c){
    if(SHAPES[c.zip])return fromBuffer(c,b64buf(SHAPES[c.zip]));   // ข้อมูลที่รวมไว้ใน shapes.js (ใช้ได้แม้เปิดแบบ file://)
    return fetch(c.zip).then(function(r){if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
      .then(function(buf){return fromBuffer(c,buf)})
      .catch(function(e){
        console.warn("โหลด "+c.zip+" ไม่ได้",e);
        if(!fromUrl.warned){fromUrl.warned=1;alert("โหลด "+c.zip+" ไม่ได้\nให้รัน build_shapes.py ในโฟลเดอร์นี้ก่อน (จะสร้าง shapes.js) หรือเปิดผ่านเว็บเซิร์ฟเวอร์");}
      });
  }
  function ensureLoaded(c){   // โหลดไฟล์ของชั้นนี้ครั้งแรกที่ถูกเปิดใช้
    if(c.loaded||c.loading||c.picker)return;
    c.loading=true;
    fromUrl(c).then(function(){c.loading=false});
  }

  /* ---------- label: ซ่อนเมื่อซูมออกไกล ---------- */
  function updLabels(){
    box.querySelector(".mm-map").classList.toggle("mm-showlbl",map.getZoom()>=LABEL_MIN_ZOOM);
  }

  /* ---------- ค้นหาจาก lat, long ---------- */
  var searchLayer;
  function ringHas(ring,lat,lng){   // ray casting
    var c=false,i,j;
    for(i=0,j=ring.length-1;i<ring.length;j=i++){
      var a=ring[i],b=ring[j];
      if((a.lat>lat)!==(b.lat>lat)&&lng<(b.lng-a.lng)*(lat-a.lat)/(b.lat-a.lat)+a.lng)c=!c;
    }
    return c;
  }
  function polyHas(rings,lat,lng){  // rings[0]=ขอบนอก ที่เหลือ=รู
    if(!rings.length||!ringHas(rings[0],lat,lng))return false;
    for(var i=1;i<rings.length;i++)if(ringHas(rings[i],lat,lng))return false;
    return true;
  }
  function layerHas(l,lat,lng){
    if(l.getLatLng&&!l.getLatLngs)return map.distance(l.getLatLng(),[lat,lng])<=20;   // ชั้นจุด
    var ll=l.getLatLngs&&l.getLatLngs();
    if(!ll||!ll.length)return false;
    if(ll[0].lat!==undefined)return ringHas(ll,lat,lng);                  // ring เดี่ยว
    if(ll[0][0]&&ll[0][0].lat!==undefined)return polyHas(ll,lat,lng);     // Polygon
    return ll.some(function(p){return polyHas(p,lat,lng)});              // MultiPolygon
  }
  function num(inp){
    var m=inp.value.replace(/[°\s]/g,"").match(/^-?\d+(?:\.\d+)?$/);
    return m?+m[0]:NaN;
  }
  function parsePair(s){   // "14.59, 101.01" / "14.59 101.01" -> [lat,lng] หรือ null
    var m=String(s).replace(/°/g," ").match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
    return m?[+m[1],+m[2]]:null;
  }
  function doSearch(lat,lng,ia,io){   // ia/io = ช่องที่จะขึ้นกรอบแดงเมื่อค่าผิด (โหมดช่องเดียวใช้ช่องเดียวกัน)
    var bad=[];
    if(!(Math.abs(lat)<=90))bad.push(ia);
    if(!(Math.abs(lng)<=180))bad.push(io);
    if(bad.length){
      bad.forEach(function(i){i.classList.add("err");setTimeout(function(){i.classList.remove("err")},1500)});
      return;
    }
    searchLayer.clearLayers();
    var pt=L.latLng(lat,lng);
    L.marker(pt).addTo(searchLayer);
    focusAt(pt,17);
  }
  /* ซูมไปที่จุด และถ้าจุดอยู่ในพื้นที่ของ feature ใดให้เปิด popup ของ feature นั้น */
  function focusAt(pt,zoom){
    map.setView(pt,Math.max(map.getZoom(),zoom));
    var hit=null;
    LAYERS.forEach(function(c){
      if(hit||!c.loaded||!map.hasLayer(c.layer))return;
      c.layer.eachLayer(function(l){if(!hit&&layerHas(l,pt.lat,pt.lng))hit=l});
    });
    if(hit)hit.openPopup(pt);
  }

  /* ---------- ตำแหน่งปัจจุบันแบบติดตามต่อเนื่อง (GPS Tracking) ---------- */
  var locLayer;
  var gpsWatchId = null;
  var gpsFollowing = false;
  function addLocate(){
    locLayer=L.layerGroup().addTo(map);
    var C=L.Control.extend({options:{position:"topleft"},onAdd:function(){
      var d=L.DomUtil.create("div","leaflet-bar leaflet-control"),
          a=L.DomUtil.create("a","mm-loc",d);
      a.href="#";
      a.setAttribute("role","button");
      a.title="เริ่มติดตามตำแหน่งปัจจุบัน";
      a.setAttribute("aria-label","เริ่มติดตามตำแหน่งปัจจุบัน");
      a.textContent="📍";

      function stopTracking(){
        if(gpsWatchId!==null){
          navigator.geolocation.clearWatch(gpsWatchId);
          gpsWatchId=null;
        }
        gpsFollowing=false;
        delete a.dataset.gpsStarted;
        a.classList.remove("busy","tracking");
        a.title="เริ่มติดตามตำแหน่งปัจจุบัน";
        a.setAttribute("aria-label","เริ่มติดตามตำแหน่งปัจจุบัน");
      }

      a.onclick=function(e){
        e.preventDefault();
        if(gpsWatchId!==null){
          stopTracking();
          return;
        }
        if(!navigator.geolocation){
          alert("เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง");
          return;
        }

        gpsFollowing=true;
        a.classList.add("busy","tracking");
        a.title="กำลังติดตามตำแหน่ง — กดเพื่อหยุด";
        a.setAttribute("aria-label","กำลังติดตามตำแหน่ง กดเพื่อหยุด");

        gpsWatchId=navigator.geolocation.watchPosition(function(pos){
          a.classList.remove("busy");
          var pt=L.latLng(pos.coords.latitude,pos.coords.longitude);
          var acc=pos.coords.accuracy||0;
          locLayer.clearLayers();
          if(acc>0){
            L.circle(pt,{
              radius:acc,
              color:"#2563eb",
              weight:1,
              fillColor:"#2563eb",
              fillOpacity:.12,
              interactive:false
            }).addTo(locLayer);
          }
          L.circleMarker(pt,{
            radius:8,
            color:"#fff",
            weight:3,
            fillColor:"#2563eb",
            fillOpacity:1
          }).addTo(locLayer);

          // ครั้งแรกซูมเข้าไปยังตำแหน่งปัจจุบัน จากนั้นเลื่อนแผนที่ตาม GPS
          if(gpsFollowing){
            if(!a.dataset.gpsStarted){
              map.setView(pt,Math.max(map.getZoom(),18));
              a.dataset.gpsStarted="1";
            }else{
              map.panTo(pt,{animate:true,duration:.5});
            }
          }
        },function(err){
          stopTracking();
          delete a.dataset.gpsStarted;
          alert("ติดตามตำแหน่งปัจจุบันไม่ได้: "+(
            err.code===1?"ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง":
            err.code===2?"ไม่พบตำแหน่ง GPS":
            err.code===3?"หมดเวลารอ GPS":err.message||"ไม่ทราบสาเหตุ"
          ));
        },{
          enableHighAccuracy:true,
          timeout:20000,
          maximumAge:1000
        });
      };
      L.DomEvent.disableClickPropagation(d);
      return d;
    }});
    new C().addTo(map);
  }
  function addSearch(){
    searchLayer=L.layerGroup().addTo(map);
    var C=L.Control.extend({options:{position:"topleft"},onAdd:function(){
      var d=L.DomUtil.create("div","mm-search leaflet-bar");
      d.innerHTML='<button type="button" class="tg" title="ย่อเครื่องมือค้นหา">ย่อ</button>'+
        '<div class="bd"><div class="ins"><input type="text" inputmode="decimal" class="la" placeholder="lat" aria-label="Latitude">'+
        '<input type="text" inputmode="decimal" class="lo" placeholder="long" aria-label="Longitude">'+
        '<input type="text" class="ll" placeholder="lat, long เช่น 14.59, 101.01" aria-label="lat, long"></div>'+
        '<div class="btns"><button type="button" class="go" title="ค้นหา">🔍</button>'+
        '<button type="button" class="sw" title="สลับ: แยก lat/long 2 ช่อง ↔ ช่องเดียว">⇄</button>'+
        '<button type="button" class="clr" title="ล้างผลการค้นหา">💫ล้างผลค้นหา</button></div></div>';
      var ia=d.querySelector(".la"),io=d.querySelector(".lo"),il=d.querySelector(".ll");
      var tg=d.querySelector(".tg");
      tg.onclick=function(){   // ขยายอยู่: แสดง ◀ (กดเพื่อย่อ) · ย่ออยู่: แสดง 📍 (กดเพื่อขยาย)
        var c=d.classList.toggle("col");
        tg.textContent=c?"🌐":"ย่อ";
        tg.title=c?"ขยายเครื่องมือค้นหา":"ย่อเครื่องมือค้นหา";
      };
      function run(){
        if(d.classList.contains("one")){
          var p=parsePair(il.value);
          if(!p){il.classList.add("err");setTimeout(function(){il.classList.remove("err")},1500);return;}
          doSearch(p[0],p[1],il,il);
        }else doSearch(num(ia),num(io),ia,io);
      }
      d.querySelector(".go").onclick=run;
      d.querySelector(".sw").onclick=function(){   // สลับโหมด พร้อมแปลงค่าที่กรอกไว้
        if(d.classList.contains("one")){
          var p=parsePair(il.value);if(p){ia.value=p[0];io.value=p[1];}
          d.classList.remove("one");
        }else{
          if(ia.value||io.value)il.value=ia.value.trim()+", "+io.value.trim();
          d.classList.add("one");
        }
      };
      d.querySelector(".clr").onclick=function(){ia.value="";io.value="";il.value="";searchLayer.clearLayers();if(locLayer)locLayer.clearLayers();map.closePopup();};
      [ia,io,il].forEach(function(i){i.onkeydown=function(e){if(e.key==="Enter")run()}});
      L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
      return d;
    }});
    new C().addTo(map);
  }

  /* ---------- สร้าง popup + แผนที่ ---------- */

function build(){
    back=document.createElement("div");
    back.className="mm-back hide";

    back.innerHTML=
        '<div class="mm-box">'+
        '<div class="mm-map"></div>'+
        '<p class="mm-warn"><b><i>* <u>อยู่ระหว่างศึกษา</u> รายละเอียดตามข้อกำหนดฉบับปิดประกาศ 15 วัน (28 พ.ย. – 12 ต.ค. 69)</i></b></p>'+
        '</div>';

    document.body.appendChild(back);

    box=back.firstChild;

    if(START_FULL){
    back.classList.add("full");
    }

    // คลิกพื้นที่ด้านนอกเพื่อปิดแผนที่
    back.addEventListener("mousedown",function(e){
        if(e.target===back)close();
    });

    // ไม่ผูกปุ่ม ESC กับการปิดแผนที่ เพื่อป้องกันการกดพลาด
    var mapElement = box.querySelector(".mm-map");
      map = L.map(mapElement, {
          zoomControl: false,
          maxZoom: 22,
          dragging: true,
          touchZoom: true,
          tap: true,
          doubleClickZoom: true
      }).setView([14.59, 101.0], 11);

      // กำหนดให้พื้นที่แผนที่รับ Touch โดยตรง
      mapElement.style.touchAction = "none";
      mapElement.style.webkitUserSelect = "none";

      // เปิดการลากแผนที่
      map.dragging.enable();
      map.touchZoom.enable();
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        minZoom: 2,
        maxNativeZoom: 19,
        maxZoom: 22,
        attribution: '&copy; OpenStreetMap contributors'
      });
    var sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:22,attribution:"Esri"});
    map.layerCtl=L.control.layers(
    {"แผนที่":osm,"ดาวเทียม":sat},{}
        ).addTo(map);

        osm.addTo(map);
    LAYERS.forEach(function(c){   // ทุกชั้นอยู่ในรายการเลือก; ชั้นที่ on:true เปิดไว้แต่แรก
      makeLayer(c);
      map.layerCtl.addOverlay(c.layer,c.name);
      if(c.on)c.layer.addTo(map);
    });
    map.on("overlayremove",updLegend);
    map.on("overlayadd",function(e){
      updLegend();   // ติ๊กเลือกชั้นไหน ค่อยโหลดไฟล์ของชั้นนั้น
      LAYERS.forEach(function(c){if(c.layer===e.layer){if(c.loaded){if(c.isPoint)c.layer.bringToFront();fit(c);}else ensureLoaded(c);}});   // เปิดชั้นไหนซูมไปที่ชั้นนั้น (ชั้นที่ยังไม่โหลด จะซูมให้เมื่อโหลดเสร็จ)
    });
    addSearch();                       // เพิ่มก่อน zoom control เพื่อให้อยู่ด้านบน
    L.control.zoom({position:"topleft"}).addTo(map);
    addLocate();                       // เพิ่มหลัง zoom control เพื่อให้อยู่ใต้ปุ่มซูมออก
    map.on("zoomend",updLabels);updLabels();
    built=true;
  }

  function close(){if(back)back.classList.add("hide");}

  function open() {
    Promise.resolve(window.FIELD_CONFIG_READY)
      .then(function() {
        var p = (window.L && window.shp) ? Promise.resolve() :
          (loadCss(LEAFLET + "leaflet.css"),
          Promise.all([
            loadJs(LEAFLET + "leaflet.js"),
            loadJs(SHPJS)
          ]));

        return p;
      })
      .then(function() {
        if (!built) build();

      back.classList.remove("hide");

      setTimeout(function() {
          map.invalidateSize(true);

          // เปิดระบบสัมผัสอีกครั้งหลังแสดงแผนที่
          map.dragging.enable();
          map.touchZoom.enable();

          fit();
      }, 300);

        LAYERS.forEach(function(c) {
          if (map.hasLayer(c.layer)) ensureLoaded(c);
        });
      })
      .catch(function(e) {
        alert("โหลดข้อมูลไม่สำเร็จ\n" + e.message);
      });
  }

  $("mapBtn").onclick=open;
  if(AUTO_OPEN)open();
})();
function getHttpsCompatibleUrl(httpUrl) {
  if (!httpUrl) return '';
  
  // หาก URL เป็น https:// อยู่แล้ว ให้คืนค่าเดิม
  if (httpUrl.startsWith('https://')) {
    return httpUrl;
  }
  
  // ใช้ CORS Proxy เพื่อแปลง HTTP เป็น HTTPS
  const proxyPrefix = 'https://corsproxy.io/?';
  return proxyPrefix + encodeURIComponent(httpUrl);
}
</script>
